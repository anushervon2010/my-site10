<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Воридшавӣ — AuthHub</title>
    <link rel="stylesheet" a href="style.css">
</head>
<body>
    <script type="module" src="js/auth.js"></script>

<header class="header">
    <div class="logo">AuthHub</div>

    <nav>
        <a href="index.html">Асосӣ</a>
        <a href="about.html">Дар бораи мо</a>
        <a href="contact.html">Тамос</a>
    </nav>
</header>

<main class="login-page">
    <div class="login-box">
        <h1>Хуш омадед</h1>
        <p>Хизматрасониро барои воридшавӣ интихоб кунед.</p>

        <button class="social-button google" onclick="loginGoogle()">
            <span>G</span>
            Идома бо Google
        </button>

        <button class="social-button facebook" onclick="loginFacebook()">
            <span>f</span>
            Идома бо Facebook
        </button>

        <button class="social-button instagram" onclick="loginInstagram()">
            <span>◎</span>
            Идома бо Instagram
        </button>

        <div class="notice">
            Шумо ба саҳифаи расмии хизматрасонӣ равона мешавед.
            Пароли шумо дар AuthHub ворид карда намешавад.
        </div>

        <a class="back-link" href="index.html">← Бозгашт ба саҳифаи асосӣ</a>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
